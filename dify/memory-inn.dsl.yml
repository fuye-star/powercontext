app:
  description: 和高德无关的 Dify 作品：一家会记住你的小旅馆。用 PowerContext 存取跨会话记忆，Dify 负责编排与角色扮演。
  icon: 🏮
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 记忆旅馆
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.0.13@9caa0421b5519db036aaccdbf1980d1071550767d6c59e9d9388dd386a92e9f6
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext Server 地址，例如 http://host.docker.internal:8123
    id: 8f0e6f1a-3c1a-4a83-9a3a-1f4b0d6c9e01
    name: PC_BASE_URL
    selector:
    - env
    - PC_BASE_URL
    value: http://host.docker.internal:8123
    value_type: string
  - description: 运行 scripts/init_scope.py 得到的 scope_id
    id: 8f0e6f1a-3c1a-4a83-9a3a-1f4b0d6c9e02
    name: PC_SCOPE_ID
    selector:
    - env
    - PC_SCOPE_ID
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 哟，客官里边请——我是记忆旅馆的老板娘阿婆。住过我这儿的客人，说过的话、干过的事，我都记着呢。今儿个，您想聊点什么？
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 阿婆，你还记得我上次说了什么吗？
    - 我今天心情不错，想跟你说件开心事
    - 上次我在你店里是不是干了什么坏事？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: code
      id: start-source-pack_recall-target
      source: start
      sourceHandle: source
      target: pack_recall
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: pack_recall-source-recall-target
      source: pack_recall
      sourceHandle: source
      target: recall
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
      id: recall-source-llm-target
      source: recall
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: llm-source-pack_remember-target
      source: llm
      sourceHandle: source
      target: pack_remember
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: pack_remember-source-remember-target
      source: pack_remember
      sourceHandle: source
      target: remember
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: answer
      id: remember-source-answer-target
      source: remember
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables: []
      height: 54
      id: start
      position:
        x: 40
        y: 320
      positionAbsolute:
        x: 40
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(query: str, scope_id: str) -> dict:\n    payload = {\n        \"scope_id\": scope_id,\n        \"query\": query,\n        \"limit\": 5,\n        \"mode\": \"fts\",\n    }\n    return {\"payload\": json.dumps(payload, ensure_ascii=False)}\n"
        code_language: python3
        desc: 用 json.dumps 组装请求体，避免用户输入里的引号破坏 JSON
        selected: false
        title: 组装检索请求
        type: code
        outputs:
          payload:
            children: null
            type: string
        variables:
        - value_selector:
          - sys
          - query
          variable: query
        - value_selector:
          - env
          - PC_SCOPE_ID
          variable: scope_id
      height: 54
      id: pack_recall
      position:
        x: 340
        y: 320
      positionAbsolute:
        x: 340
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: recall-body
            key: ''
            type: text
            value: '{{#pack_recall.payload#}}'
          type: json
        desc: 从 PowerContext 检索与本次输入相关的历史记忆
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 200
        selected: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 检索记忆
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/memory/search'
        variables: []
      height: 135
      id: recall
      position:
        x: 640
        y: 320
      positionAbsolute:
        x: 640
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 阿婆这个角色，根据检索到的记忆决定说什么
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.85
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: 3b1c9d42-5a6e-4c1b-9f0d-2e7a8c4b1d01
          role: system
          text: "你是「记忆旅馆」的老板娘阿婆，一家开在巷子深处的老旅店的主人。\n你的说话风格：热情、爱唠嗑、记性极好，偶尔损人但心软，喜欢用「哎哟」「你这孩子」这类口头禅。\n\n【你的记忆】\n下面是从记忆库（PowerContext）检索到的、和这位客人有关的历史记录（JSON）：\n{{#recall.body#}}\n\n规则：\n1. 如果 hits 为空或没有相关内容，说明这是你们第一次见面（或你一时没想起来）。自然地问候，问问对方怎么称呼、来做什么。\n2. 如果 hits 里有内容，必须自然地提起 1-2 个具体细节（对方上次说过的话、做过的事），不要罗列 JSON，也绝不能编造记忆里没有的事。\n3. 记忆里可能有错别字或口语，按你的理解转述即可，但不要歪曲成相反的意思。\n4. 你只知道自己店里发生的事和客人告诉过你的事；不知道就说「这我可不知道」。\n5. 回答控制在 120 字以内，像真人聊天，不要用列表，不要暴露「记忆库」「JSON」「系统」这些词。\n6. 如果客人说了值得记住的新事情（喜好、承诺、糗事），用一句话回应，表示你记住了。\n"
        - id: 3b1c9d42-5a6e-4c1b-9f0d-2e7a8c4b1d02
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 阿婆
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: llm
      position:
        x: 940
        y: 320
      positionAbsolute:
        x: 940
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(query: str, reply: str, scope_id: str) -> dict:\n    text = \"玩家说：\" + query.strip() + \"\\n阿婆记下：\" + reply.strip()\n    payload = {\"scope_id\": scope_id, \"kind\": \"interaction\", \"text\": text[:800]}\n    return {\"payload\": json.dumps(payload, ensure_ascii=False)}\n"
        code_language: python3
        desc: 把这一轮对话压缩成一条记忆，用 json.dumps 安全编码
        selected: false
        title: 组装记忆
        type: code
        outputs:
          payload:
            children: null
            type: string
        variables:
        - value_selector:
          - sys
          - query
          variable: query
        - value_selector:
          - llm
          - text
          variable: reply
        - value_selector:
          - env
          - PC_SCOPE_ID
          variable: scope_id
      height: 54
      id: pack_remember
      position:
        x: 1240
        y: 320
      positionAbsolute:
        x: 1240
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: remember-body
            key: ''
            type: text
            value: '{{#pack_remember.payload#}}'
          type: json
        desc: 把本轮互动写回 PowerContext，供下一次会话召回
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 200
        selected: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 写入记忆
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/memory/remember'
        variables: []
      height: 135
      id: remember
      position:
        x: 1540
        y: 320
      positionAbsolute:
        x: 1540
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm.text#}}'
        desc: ''
        selected: false
        title: 直接回复
        type: answer
        variables: []
      height: 122
      id: answer
      position:
        x: 1840
        y: 320
      positionAbsolute:
        x: 1840
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 20
      y: 120
      zoom: 0.7
